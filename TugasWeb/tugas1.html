<!DOCTYPE html>
<html lang="en">
<head>
    <title>ONLINE ORDER</title>

    <style>
        body {
            font-family: Arial;
        }
        
        table {
            border-collapse: collapse;
            width: 800px;
            margin: 50px auto;
        }

        td {
            border: 1px solid black;
            padding: 8px;
        }

        .judul {
            background-color: #4389C5;
            color: white;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
        }

        .header {
            background-color:#558B2F;
            color: white;
            text-align: center;
            font-weight: bold;
        }

        .merah {
            background-color: #E53935;
        }
        .kuning {
            background-color: #FFCC00;
        }
        .nomor {
            text-align: center;
        }
        .qty {
            text-align: center;
        }
        .harga {
            text-align: right;
        }
        .total {
            text-align: center;
        }
        .note {
            background-color: white;
            vertical-align: middle;
        }
        .tabel-note {
            width: 100%;
            border-collapse: collapse;
        }
        .table-note td {
            border: 1px solid gray;
            padding: 8px;
        }
        .note-judul {
            background-color: #C63858;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>
    
    <table>

        <tr>
            <td colspan="5"class="judul">
                ONLINE ORDER
            </td>
            
        </tr>

        <tr class="header">
            <td>NO</td>
            <td>Nama Barang</td>
            <td>QTY</td>
            <td>Harga (Rp)</td>
            <td>Email Account Note</td>
        </tr>

        <tr class="merah">
            <td class="nomor">1</td>
            <td>DEAM 2 Gb</td>
            <td class="qty">1</td>
            <td class="harga">45.000</td>
            <td rowspan="6" class="note">

                <table class="tabel-note">
                    <tr class="note-judul">
                        <td>Mail Box</td>
                        <td>10 GB</td>
                    </tr>

                    <tr>
                        <td>Webmail</td>
                        <td>Yes</td>
                    </tr>

                    <tr>
                        <td>POP 3</td>
                        <td>No</td>
                    </tr>
                </table>
            </td>
        </tr>
    
    <tr class="kuning">
        <td class="nomor">2</td>
        <td>DEAM/COMPORT 4 GB</td>
        <td class="qty">2</td>
        <td class="harga">90.000</td>
    </tr>
    
    <tr class="merah">
        <td class="nomor">3</td>
        <td>COMPORT 8 GB</td>
        <td class="qty">1</td>
        <td class="harga">80.000</td>
    </tr>

    <tr class="kuning">
        <td lass="nomor">4</td>
        <td>APACER 4GB / 8GB / 16GB</td>
        <td class="qty">1</td>
        <td class="harga">48.000</td>
    </tr>

    <tr class="merah">
        <td class="nomor">5</td>
        <td>SEAGATE 250 GB USB</td>
        <td class="qty">1</td>
        <td class="harga">741.000</td>
    </tr>

    <tr>
        <td colspan="2" class="total">
            TOTAL BAYAR
        </td>

        <td class="qty">6</td>

        <td class="harga">
            <b>994.000</b>
        </td>
    </tr>
    </table>

</body>
</html>
